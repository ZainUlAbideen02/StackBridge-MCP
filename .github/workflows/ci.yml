name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Lint & Type Check Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pydantic networkx tree-sitter tree-sitter-python tree-sitter-typescript mcp pytest pytest-asyncio

      - name: Run Ruff Linter
        run: ruff check stackbridge/ tests/

      - name: Run Mypy Type Checker
        run: mypy --ignore-missing-imports stackbridge/

  test-matrix:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    needs: lint-and-typecheck
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Package & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pytest pytest-asyncio

      - name: Run Full Test Suite
        run: pytest -v tests/

      - name: Run Benchmark Suite
        run: python -m stackbridge.benchmarks.benchmark_runner

      - name: Run Standalone Mock MCP Client Test
        run: python scripts/test_mcp_client.py
